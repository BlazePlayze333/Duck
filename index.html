<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Duck Found!</title>

  <style>
    :root {
      --bg: #0f172a;
      --accent: #22c55e;
      --accent2: #38bdf8;
      --text: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1e3a8a, #020617);
      color: var(--text);
      overflow: hidden;
      position: relative;
    }
    main {
      max-width: 640px;
      width: 100%;
      background: rgba(15, 23, 42, 0.94);
      border-radius: 24px;
      padding: 24px 20px 30px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
      text-align: center;
      position: relative;
      z-index: 2;
    }
    h1 {
      margin: 0 0 4px;
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.2;
    }
    h1 span {
      display: inline-block;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      color: transparent;
    }
    p {
      margin: 0 0 18px;
      line-height: 1.6;
      opacity: 0.95;
      font-size: 18px;
      white-space: pre-line;
    }
    .duck-emoji-static {
      font-size: 48px;
      margin-bottom: 6px;
    }
    .tagline {
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      opacity: 0.75;
      margin-bottom: 10px;
    }
    .quack-btn {
      margin-top: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      border: none;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: #020617;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    /* ducks that follow the mouse */
    .duck-follow {
      position: fixed;
      width: 32px;
      height: 32px;
      pointer-events: none;
      font-size: 32px;
      transform: translate(-50%, -50%);
      z-index: 1;
    }

    /* form styles */
    form {
      margin-top: 24px;
      text-align: left;
    }
    .form-row {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
      opacity: 0.9;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(148,163,184,0.6);
      background: rgba(15,23,42,0.9);
      color: var(--text);
      font-size: 14px;
    }
    input::placeholder {
      color: rgba(148,163,184,0.9);
    }
    .submit-btn {
      margin-top: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: rgba(56,189,248,0.9);
      color: #020617;
    }
    .form-note {
      margin-top: 6px;
      font-size: 12px;
      opacity: 0.75;
      text-align: left;
    }
  </style>

  <!-- Google Analytics GA4: replace G-XXXXXXXXXX with your Measurement ID -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>
</head>
<body>
  <main>
    <div class="duck-emoji-static">🦆</div>

    <div class="tagline">oh what luck...</div>
    <h1><span>you found a duck!</span></h1>

    <p>
keep or hide, you decide.
Congrats!
This duck came from Dallas, Texas.
    </p>

    <button class="quack-btn" id="quackButton">
      🦆 Play duck noise
    </button>

    <!-- Duck find form (Formspree) -->
    <form
      action="https://formspree.io/f/mojgyrkp"
      method="POST"
    >
      <div class="form-row">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Your name" required />
      </div>
      <div class="form-row">
        <label for="from">Where are you from?</label>
        <input id="from" name="from" type="text" placeholder="City, Country" required />
      </div>

      <!-- Extra metadata so you know which duck / page -->
      <input type="hidden" name="duck-page" value="Dallas cruise ducks" />

      <button class="submit-btn" type="submit">Submit duck find</button>
      <div class="form-note">
        When you submit, your answer is sent to the duck creator.
      </div>
    </form>
  </main>

  <!-- ducks that follow the mouse -->
  <div class="duck-follow" id="duck0">🦆</div>
  <div class="duck-follow" id="duck1">🦆</div>
  <div class="duck-follow" id="duck2">🦆</div>

  <!-- audio file living next to index.html -->
  <audio id="duckSound">
    <source src="duck.mp3" type="audio/mpeg">
  </audio>

  <script>
    // ===== DUCKS FOLLOW THE MOUSE WITH SMOOTH LERP =====
    const ducks = [
      { el: document.getElementById('duck0'), x: window.innerWidth / 2, y: window.innerHeight / 2 },
      { el: document.getElementById('duck1'), x: window.innerWidth / 2, y: window.innerHeight / 2 },
      { el: document.getElementById('duck2'), x: window.innerWidth / 2, y: window.innerHeight / 2 },
    ];

    const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    function animateDucks() {
      ducks.forEach((duck, index) => {
        const target = index === 0 ? mouse : ducks[index - 1];
        const speed = 0.14;

        duck.x += (target.x - duck.x) * speed;
        duck.y += (target.y - duck.y) * speed;

        duck.el.style.left = duck.x + 'px';
        duck.el.style.top = duck.y + 'px';
      });
      requestAnimationFrame(animateDucks);
    }
    animateDucks();

    // ===== PLAY AUDIO ON BUTTON CLICK =====
    const quackButton = document.getElementById('quackButton');
    const duckSound = document.getElementById('duckSound');

    quackButton.addEventListener('click', () => {
      duckSound.currentTime = 0;
      duckSound.play().catch((err) => {
        console.warn("Unable to play duck sound:", err);
      });
    });
  </script>
</body>
</html>

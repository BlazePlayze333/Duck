<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Duck Found!</title>
  <style>
    :root {
      --bg: #0f172a;
      --accent: #22c55e;
      --accent2: #38bdf8;
      --text: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1e3a8a, #020617);
      color: var(--text);
      overflow: hidden;
      position: relative;
    }
    main {
      max-width: 640px;
      width: 100%;
      background: rgba(15, 23, 42, 0.94);
      border-radius: 24px;
      padding: 24px 20px 30px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
      text-align: center;
      position: relative;
      z-index: 2;
    }
    h1 {
      margin: 0 0 4px;
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.2;
    }
    h1 span {
      display: inline-block;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      color: transparent;
    }
    p {
      margin: 0 0 18px;
      line-height: 1.6;
      opacity: 0.95;
      font-size: 18px;
      white-space: pre-line;
    }
    .duck-emoji-static {
      font-size: 48px;
      margin-bottom: 6px;
    }
    .tagline {
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      opacity: 0.75;
      margin-bottom: 10px;
    }
    .quack-btn {
      margin-top: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      border: none;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: #020617;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    /* ducks that follow the mouse (smooth trailing) */
    .duck-follow {
      position: fixed;
      width: 32px;
      height: 32px;
      pointer-events: none;
      font-size: 32px;
      transform: translate(-50%, -50%);
      z-index: 1;
    }
  </style>
</head>
<body>
  <main>
    <div class="duck-emoji-static">🦆</div>

    <div class="tagline">oh what luck...</div>
    <h1><span>you found a duck!</span></h1>

    <p>
oh what luck...
you found a duck!
keep or hide, you decide.
Congrats!
This duck came from Dallas, Texas.
    </p>

    <button class="quack-btn" id="quackButton">
      🦆 Play duck noise
    </button>
  </main>

  <!-- ducks that follow the mouse -->
  <div class="duck-follow" id="duck0">🦆</div>
  <div class="duck-follow" id="duck1">🦆</div>
  <div class="duck-follow" id="duck2">🦆</div>

  <script>
    // ===== DUCKS FOLLOW THE MOUSE WITH SMOOTH LERP =====
    const ducks = [
      { el: document.getElementById('duck0'), x: window.innerWidth / 2, y: window.innerHeight / 2 },
      { el: document.getElementById('duck1'), x: window.innerWidth / 2, y: window.innerHeight / 2 },
      { el: document.getElementById('duck2'), x: window.innerWidth / 2, y: window.innerHeight / 2 },
    ];

    const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    function animateDucks() {
      ducks.forEach((duck, index) => {
        const target = index === 0 ? mouse : ducks[index - 1];
        const speed = 0.14;  // adjust for how tightly they follow

        duck.x += (target.x - duck.x) * speed;
        duck.y += (target.y - duck.y) * speed;

        duck.el.style.left = duck.x + 'px';
        duck.el.style.top = duck.y + 'px';
      });

      requestAnimationFrame(animateDucks);
    }
    animateDucks();

    // ===== INLINE BASE64 DUCK NOISE (EXAMPLE SOUND) =====
    // This is a tiny WAV beep-like clip as a data URI.
    // You can replace it with your own data URI if you want.
    const duckDataUrl =
      "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAIAfAAACABAAZGF0YQAAAAAA" +
      "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" +
      "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA";

    let duckSound = null;
    try {
      duckSound = new Audio(duckDataUrl);
    } catch (err) {
      console.warn("Duck data URL is invalid:", err);
    }

    const quackButton = document.getElementById('quackButton');
    quackButton.addEventListener('click', () => {
      if (!duckSound) return;
      duckSound.currentTime = 0;
      duckSound.play().catch((err) => {
        console.warn("Unable to play duck sound:", err);
      });
    });
  </script>
</body>
</html>

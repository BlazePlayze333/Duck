<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Duck Found!</title>
  <style>
    :root {
      --bg: #0f172a;
      --accent: #22c55e;
      --accent2: #38bdf8;
      --text: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1e3a8a, #020617);
      color: var(--text);
    }
    main {
      max-width: 640px;
      width: 100%;
      background: rgba(15, 23, 42, 0.94);
      border-radius: 24px;
      padding: 24px 20px 26px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
      text-align: center;
    }
    h1 {
      margin: 0 0 4px;
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.2;
    }
    h1 span {
      display: inline-block;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      color: transparent;
    }
    p {
      margin: 0;
      line-height: 1.6;
      opacity: 0.95;
      font-size: 18px;
      white-space: pre-line;
    }
    .duck-emoji {
      font-size: 48px;
      margin-bottom: 6px;
    }
    .tagline {
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      opacity: 0.75;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <main>
    <div class="duck-emoji">🦆</div>

    <div class="tagline">oh what luck...</div>
    <h1><span>you found a duck!</span></h1>

    <p>
oh what luck...
you found a duck!
keep or hide, you decide.
Congrats!
    </p>
  </main>
</body>
</html>
